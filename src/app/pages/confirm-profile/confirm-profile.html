<div class="min-h-dvh sm:grid sm:place-items-center sm:p-3.5">
  <p-card styleClass="pt-16 sm:pt-0 w-full sm:w-4/5 md:w-2/3 md:max-w-lg min-h-dvh sm:min-h-fit">
    <h1 class="text-5xl lg:text-6xl text-center font-black my-auto pb-4 animate-pulse">Fi</h1>
    <p class="text-sm text-center mb-4">
      {{
        isInvited
          ? 'Vous êtes invité à créer votre compte ici.'
          : 'Veuillez remplir le formulaire pour compléter votre profil.'
      }}
    </p>
    <form class="space-y-4" [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
      <div class="space-y-1">
        <label for="name" class="block font-medium">Votre nom</label>
        <p-iconfield>
          <p-inputicon class="pi pi-id-card" />
          <input
            type="text"
            id="name"
            autocomplete="given-name"
            formControlName="name"
            pInputText
            fluid
          />
        </p-iconfield>
      </div>
      <div class="space-y-1">
        <label for="home" class="block font-medium">Nom de votre foyer</label>
        <p-iconfield>
          <p-inputicon class="pi pi-home" />
          <input type="text" id="home" formControlName="home" pInputText fluid />
        </p-iconfield>
      </div>
      <div class="space-y-1">
        <label class="block font-medium">Votre email</label>
        <p-iconfield>
          <p-inputicon class="pi pi-envelope" />
          <input
            type="email"
            autocomplete="email"
            [value]="user()?.email"
            readonly
            disabled
            pInputText
            fluid
          />
        </p-iconfield>
      </div>
      <div class="space-y-1">
        <label for="currency">Devise</label>
        <p-select
          inputId='currency'
          formControlName="currency"
          [options]="currencies"
          optionLabel="name"
          optionValue="value"
          placeholder="Sélectionner la devise"
          fluid
        />
      </div>
      <div class="space-y-1">
        <label for="password" class="block font-medium">Mot de passe</label>
        <p-iconfield>
          <p-inputicon class="pi pi-lock" />
          <p-password
            type="password"
            inputId="password"
            autocomplete="new-password"
            formControlName="password"
            toggleMask="true"
            fluid
            [minlength]="6"
          />
        </p-iconfield>
      </div>
      <div class="space-y-1">
        <label for="confirm-password" class="block font-medium">Confirmer le mot de passe</label>
        <p-iconfield>
          <p-inputicon class="pi pi-lock" />
          @let incorrectPassword = registrationForm.hasError('passwordsNotMatching') && confirm.touched;
          <p-password
            type="password"
            inputId="confirm-password"
            autocomplete="new-password"
            formControlName="confirm"
            toggleMask="true"
            fluid
            [feedback]="false"
            [invalid]="incorrectPassword"
          />
        </p-iconfield>
        @if ( incorrectPassword ) {
        <p-message size="small" severity="error" variant="simple"
          >Mot de passe incorrect.</p-message
        >
        }
      </div>
      <p-button
        fluid
        type="submit"
        severity="primary"
        [disabled]="registrationForm.invalid"
        [loading]="isLoading()"
        >Enregistrer</p-button
      >
    </form>
  </p-card>
</div>
