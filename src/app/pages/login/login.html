<div class="min-h-dvh sm:grid sm:place-items-center sm:p-3.5">
  <p-card styleClass="pt-16 sm:pt-0 w-full sm:w-4/5 md:w-2/3 md:max-w-lg min-h-dvh sm:min-h-fit">
    <h1 class="text-5xl lg:text-6xl text-center font-black my-auto pb-4 animate-pulse">Fi</h1>
    <p class="text-sm text-center mb-8">Maitriser le budget de votre foyer</p>
    @if(errorMsg()) {
    <p-message class="mb-4 block" severity="error" variant="text">{{ errorMsg() }}</p-message>
    } @if(warningMsg()) {
    <p-message class="mb-4 block" severity="warn" variant="text">{{ warningMsg() }}</p-message>
    }
    <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm" class="space-y-4">
      <div class="space-y-1">
        <label for="email" class="block font-medium">Email</label>
        <p-iconfield>
          <p-inputicon class="pi pi-envelope" />
          <input
            type="email"
            name="email"
            id="email"
            placeholder="betoky@gmail.com"
            autocomplete="username"
            ngModel
            #email="ngModel"
            required
            email
            pInputText
            fluid
          />
        </p-iconfield>
        @if (email.invalid && (email.touched)) {
        <p-message severity="error" variant="simple" size="small"
          >L'email n'est pas valide.</p-message
        >
        }
      </div>
      <div class="space-y-1">
        <label for="password" class="block font-medium">Mot de passe</label>
        <p-iconfield>
          <p-inputicon class="pi pi-lock" />
          <p-password
            type="password"
            name="password"
            inputId="password"
            placeholder="••••••••••"
            autocomplete="current-password"
            required
            ngModel
            toggleMask="true"
            feedback="false"
            fluid
          />
        </p-iconfield>
      </div>
      <p-button
        fluid
        type="submit"
        [disabled]="!loginForm.form.valid"
        class="my-6 w-full btn btn-primary flex items-center justify-center gap-1.5"
        label="Login"
        [loading]="isLoading()"
      />
      <div class="text-xs font-medium text-center">
        Vous n'avez pas encore de compte ?<br />Contactez-moi à l'adresse
        <a
          class="font-medium outline-none focus:ring-2 link focus:ring-primary-focus hover:underline"
          href="mailto:mahefarisont@gmail.com"
          >mahefarisont@gmail.com</a
        >
      </div>
    </form>
  </p-card>
</div>
