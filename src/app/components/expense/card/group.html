<exp-base-card
  [id]="expense().id"
  [date]="expense().date"
  [name]="expense().name"
  [description]="expense().description"
  [amount]="expense().amount"
  [hasCollapse]="true"
  [badge]="badge()"
  (onEdit)="openModal()"
  (onCollapse)="onCollapse($event)"
>
  <p-table size="small" [value]="details()" stripedRows showGridlines>
    <ng-template #header>
      <tr>
        <th pSortableColumn="article.name">
          <div class="flex items-center gap-2">
            Article
            <p-sortIcon field="article.name" />
          </div>
        </th>
        <th class="text-center">Quantité</th>
        <th pSortableColumn="amount">
          <div class="flex justify-center items-center gap-2">
            Prix
            <p-sortIcon field="amount" />
          </div>
        </th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      @if (fetched()) { @let unit = item.article.unit; @let quantity = item.quantity;
      <tr>
        <td>{{ item.article.name }}</td>
        <td class="text-center">
          {{ unit ? `${quantity} ${unit}` : hasMore(quantity) ? quantity : '' }}
        </td>
        <td class="text-end">{{ item.amount | appCurrency }}</td>
      </tr>
      } @else {
      <tr>
        <td><p-skeleton /></td>
        <td><p-skeleton /></td>
        <td><p-skeleton /></td>
      </tr>
      }
    </ng-template>
  </p-table>
</exp-base-card>
