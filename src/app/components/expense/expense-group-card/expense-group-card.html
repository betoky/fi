<expense-card
  [date]="expense.date"
  [name]="expense.name"
  [description]="expense.description"
  [amount]="expense.total"
  [hasCollapse]="true"
  (onEdit)="editExpGroup()"
  (onDelete)="deleteExpGroup()"
  (onCollapse)="onCollapse($event)"
>
  <p-table size="small" [value]="items()" stripedRows showGridlines>
    <ng-template #header>
      <tr>
        <th pSortableColumn="article.name">
          <div class="flex items-center gap-2">
            Article
            <p-sortIcon field="article.name" />
          </div>
        </th>
        <th>Quantité</th>
        <th pSortableColumn="amount">
          <div class="flex justify-center items-center gap-2">
            Prix
            <p-sortIcon field="amount" />
          </div>
        </th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      @if (fetched()) {
        <tr>
          <td>{{ item.article.name }}</td>
          <td>{{ item.quantity }} {{ item.article.unit }}</td>
          <td class="text-end">{{ item.amount | appCurrency }}</td>
        </tr>
      } @else {
        <tr>
          <td><p-skeleton /></td>
          <td><p-skeleton /></td>
          <td><p-skeleton /></td>
        </tr>
      }
    </ng-template>
  </p-table>
</expense-card>
